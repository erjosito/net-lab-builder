#cloud-config
# vm-onprem-echo — HTTP/HTTPS echo service + dnsmasq
# Role   : Primary S4 test target (172.30.100.4) — reserved prefix 172.30.0.0/16 via VPN
# Label  : "echo"  (identifies which VM responded; kept distinct from ctrl VM)
# Ubuntu 22.04 LTS Gen2 · Standard_B2ts_v2
#
# Services:
#   echo-http.service — Python HTTP echo on port 80 (primary; use this for S4/S3)
#   nginx             — HTTPS reverse proxy on port 443 (self-signed cert, TLS experiment only)
#   dnsmasq           — DNS responder on 172.30.100.4:53 for onprem.lab zone (S5)
#
# TLS WARNING (portal-foundry-setup.md §5):
#   The port-443 endpoint uses a self-signed certificate. The Foundry documentation
#   does not describe a way to add a custom CA to the managed data proxy, so treat
#   this certificate as untrusted. Use port 80 for the primary route experiment.

packages:
  - nginx
  - python3
  - tcpdump
  - dnsmasq
  - openssl
  - curl
  - net-tools

write_files:
  # ── Python echo service (HTTP, port 80) ─────────────────────────────────────
  - path: /opt/echo/app.py
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env python3
      """
      Echo service for foundry-agent-reserved-prefix-reachability lab.
      GET /api/echo?msg=<text>  →  {"echo":"<text>","label":"echo","server_ip":"172.30.100.4","request_url":"…","ts":"…","src_ip":"…"}
      GET /healthz              →  ok
      """
      import datetime
      import json
      import sys
      from http.server import BaseHTTPRequestHandler, HTTPServer
      from urllib.parse import urlparse, parse_qs

      LABEL = "echo"
      SERVER_IP = "172.30.100.4"
      PORT  = 80

      class EchoHandler(BaseHTTPRequestHandler):
          def log_message(self, fmt, *args):
              ts = datetime.datetime.utcnow().isoformat()
              sys.stdout.write(f"[{ts}] {self.address_string()} {fmt % args}\n")
              sys.stdout.flush()

          def do_GET(self):
              parsed = urlparse(self.path)
              if parsed.path == '/api/echo':
                  qs  = parse_qs(parsed.query)
                  msg = qs.get('msg', [''])[0]
                  scheme = self.headers.get('X-Forwarded-Proto', 'http')
                  host = self.headers.get('Host', SERVER_IP)
                  body = json.dumps({
                      "echo": msg,
                      "label": LABEL,
                      "server_ip": SERVER_IP,
                      "request_url": f"{scheme}://{host}{self.path}",
                      "ts": datetime.datetime.utcnow().isoformat() + "Z",
                      "src_ip": self.headers.get('X-Real-IP', self.client_address[0])
                  }).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              elif parsed.path == '/healthz':
                  self.send_response(200)
                  self.send_header('Content-Length', '2')
                  self.end_headers()
                  self.wfile.write(b'ok')
              else:
                  self.send_response(404)
                  self.end_headers()

      if __name__ == '__main__':
          server = HTTPServer(('0.0.0.0', PORT), EchoHandler)
          sys.stdout.write(f"Echo server (label={LABEL}) listening on 0.0.0.0:{PORT}\n")
          server.serve_forever()

  # ── Systemd unit for echo HTTP service ──────────────────────────────────────
  - path: /etc/systemd/system/echo-http.service
    content: |
      [Unit]
      Description=Echo HTTP service — foundry-agent lab (label=echo)
      After=network.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/echo/app.py
      Restart=always
      RestartSec=5
      User=root
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

  # ── nginx HTTPS site (self-signed — TLS experiment only, NOT for S4) ────────
  - path: /etc/nginx/sites-available/echo-https
    content: |
      # HTTPS reverse proxy — SELF-SIGNED CERT — for TLS experiment only.
      # Treat the self-signed certificate as untrusted by the managed data proxy.
      # Use port 80 (echo-http.service) for the primary route test (S4).
      server {
          listen 443 ssl;
          server_name _;

          ssl_certificate     /etc/nginx/ssl/echo-selfsigned.crt;
          ssl_certificate_key /etc/nginx/ssl/echo-selfsigned.key;
          ssl_protocols       TLSv1.2 TLSv1.3;

          location /api/echo {
              proxy_pass http://127.0.0.1:80;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header X-Real-IP $remote_addr;
          }
          location /healthz {
              proxy_pass http://127.0.0.1:80;
          }
      }

  # ── dnsmasq config — onprem.lab zone ─────────────────────────────────────────
  # Returns A records for lab hostnames queried by the Azure DNS Private Resolver
  # outbound endpoint (192.168.3.16/28) when S5 is in scope.
  # log-queries enabled so evidence of DNS resolution can be captured.
  - path: /etc/dnsmasq.d/onprem-lab.conf
    content: |
      # onprem.lab authoritative responses
      address=/echo.onprem.lab/172.30.100.4
      address=/echo-ctrl.onprem.lab/10.200.100.4
      # Bind to VM IP only; do not answer on loopback (systemd-resolved owns 127.0.0.53)
      listen-address=172.30.100.4
      bind-interfaces
      # Logging
      log-queries
      log-facility=/var/log/dnsmasq.log

runcmd:
  # ── Disable systemd-resolved stub listener (frees port 53 for dnsmasq) ──────
  - sed -i 's/#DNSStubListener=yes/DNSStubListener=no/; s/DNSStubListener=yes/DNSStubListener=no/' /etc/systemd/resolved.conf
  - systemctl restart systemd-resolved

  # ── Remove nginx default site ─────────────────────────────────────────────
  - rm -f /etc/nginx/sites-enabled/default

  # ── Generate self-signed TLS cert for port-443 experiment ────────────────
  - mkdir -p /etc/nginx/ssl
  - |
    openssl req -x509 -nodes -days 730 -newkey rsa:2048 \
      -keyout /etc/nginx/ssl/echo-selfsigned.key \
      -out    /etc/nginx/ssl/echo-selfsigned.crt \
      -subj   "/CN=172.30.100.4/O=FoundryLab/C=SE" \
      -addext "subjectAltName=IP:172.30.100.4"
  - chmod 600 /etc/nginx/ssl/echo-selfsigned.key

  # ── Enable HTTPS nginx site ───────────────────────────────────────────────
  - ln -sf /etc/nginx/sites-available/echo-https /etc/nginx/sites-enabled/echo-https

  # ── Start services ────────────────────────────────────────────────────────
  - systemctl daemon-reload
  - systemctl enable echo-http.service
  - systemctl start echo-http.service
  - systemctl enable dnsmasq
  - systemctl restart dnsmasq
  - nginx -t && systemctl restart nginx

final_message: |
  vm-onprem-echo ready.
  HTTP echo  : http://172.30.100.4/api/echo?msg=test   (use for S3/S4)
  HTTPS echo : https://172.30.100.4/api/echo?msg=test  (self-signed; TLS experiment only)
  DNS        : dnsmasq on 172.30.100.4:53 (echo.onprem.lab, echo-ctrl.onprem.lab)
  tcpdump    : run via Azure Run Command — tcpdump -i eth0 -n port 80 or port 53
