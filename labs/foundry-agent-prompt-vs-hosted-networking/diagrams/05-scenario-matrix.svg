<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880" role="img" aria-label="05 — HS1–HS5 scenario dependencies with status chips">
  <title>05 — HS1–HS5 scenario dependencies with status chips</title>
