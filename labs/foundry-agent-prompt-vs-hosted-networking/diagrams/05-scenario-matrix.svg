  <text x="30" y="34" class="t title" text-anchor="start"><tspan x="30" dy="0">05 — HS1–HS5 scenario dependencies with status chips</tspan></text>
  <text x="30" y="60" class="t small" text-anchor="start"><tspan x="30" dy="0">Prerequisites on the left; scenarios on the right. Each scenario shows pass criteria vs. observed outcome (BASELINE / PASS / DOCUMENTED).</tspan></text>
