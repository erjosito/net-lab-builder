  <!-- HS5 PASS -->
  <rect x="700" y="610" width="660" height="110" rx="8" ry="8" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <rect x="1240" y="620" width="110" height="24" rx="6" ry="6" fill="#107C10" stroke="#107C10" stroke-width="1.5"/>
  <text x="1295" y="637" class="t small" text-anchor="middle" style="fill:#FFFFFF" font-weight="700">PASS</text>
  <text x="1010" y="660" class="t lab" text-anchor="middle"><tspan x="1010" dy="0" font-weight="700">HS5 — Programmatic invocation — vm-diag SDK + azd</tspan><tspan x="1010" dy="16">Pass criteria: private DNS + SDK call (C4)</tspan><tspan x="1010" dy="16">Observed: vm-diag src_ip 192.168.2.4; Foundry DNS → 192.168.1.10</tspan></text>
