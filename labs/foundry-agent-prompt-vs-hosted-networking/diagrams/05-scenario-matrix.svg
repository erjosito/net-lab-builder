  <!-- HS3 PASS -->
  <rect x="700" y="370" width="660" height="110" rx="8" ry="8" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <rect x="1240" y="380" width="110" height="24" rx="6" ry="6" fill="#107C10" stroke="#107C10" stroke-width="1.5"/>
  <text x="1295" y="397" class="t small" text-anchor="middle" style="fill:#FFFFFF" font-weight="700">PASS</text>
