  <text x="52" y="722" class="t subtitle" text-anchor="start">Legend &amp; note</text>
  <text x="60" y="755" class="t lab" text-anchor="start"><tspan x="60" dy="0">Reserved prefix reachability was validated on the sibling lab (foundry-agent-reserved-prefix-reachability).</tspan><tspan x="60" dy="20">This diagram is a historical reference; S3/S4 are not re-runnable here without redeploying the VPN stack.</tspan><tspan x="60" dy="20">Dashed borders + orange banner mark elements pending deletion after Gate D1.</tspan></text>
