<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="06 — Programmatic invocation (HS5, C4)">
  <title>06 — Programmatic invocation (HS5, C4)</title>
  <rect x="0" y="0" width="1400" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D13438"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#107C10"/>
    </marker>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #000; }
    .title { font-size: 20px; font-weight: 700; }
    .subtitle { font-size: 13px; font-weight: 600; fill: #333; }
    .lab { font-size: 13px; }
    .lab-b { font-size: 13px; font-weight: 700; }
    .small { font-size: 11px; fill: #333; }
    .edge { font-size: 11px; fill: #1e1e1e; }
    .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 11px; }
  </style>
  <text x="30" y="34" class="t title" text-anchor="start"><tspan x="30" dy="0">06 — Programmatic invocation (HS5, C4)</tspan></text>
  <text x="30" y="60" class="t small" text-anchor="start"><tspan x="30" dy="0">Deploy surface (top), public vs private invocation, Foundry runtime, then agent egress.</tspan></text>
  <rect x="30" y="110" width="380" height="160" rx="8" ry="8" fill="transparent" stroke="#5C2D91" stroke-width="2"/>
  <text x="42" y="132" class="t subtitle" text-anchor="start">Deploy surface — VS Code Toolkit / azd (source-ZIP)</text>
  <rect x="60" y="150" width="320" height="44" rx="8" ry="8" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="220" y="176" class="t lab" text-anchor="middle"><tspan x="220" dy="0" font-weight="700">VS Code Foundry Toolkit — source-ZIP upload</tspan></text>
  <rect x="60" y="210" width="320" height="44" rx="8" ry="8" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="220" y="236" class="t lab" text-anchor="middle"><tspan x="220" dy="0" font-weight="700">azd ai agent deploy (terminal)</tspan></text>
  <rect x="460" y="110" width="440" height="160" rx="8" ry="8" fill="transparent" stroke="#495057" stroke-width="2"/>
  <text x="472" y="132" class="t subtitle" text-anchor="start">Invoke — public path (Jose workstation)</text>
  <rect x="490" y="155" width="200" height="90" rx="8" ry="8" fill="#F3F2F1" stroke="#1e1e1e" stroke-width="2"/>
  <text x="590" y="188" class="t lab" text-anchor="middle"><tspan x="590" dy="0" font-weight="700">Jose workstation</tspan><tspan x="590" dy="16">public IP</tspan><tspan x="590" dy="16">(when public access enabled)</tspan></text>
  <rect x="720" y="155" width="160" height="90" rx="8" ry="8" fill="#F3F2F1" stroke="#1e1e1e" stroke-width="2"/>
  <text x="800" y="188" class="t lab" text-anchor="middle"><tspan x="800" dy="0" font-weight="700">Public DNS</tspan><tspan x="800" dy="16">account...ai.azure.com</tspan><tspan x="800" dy="16">public IP</tspan></text>
  <path d="M 690 200 L 720 200" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="300" width="870" height="220" rx="8" ry="8" fill="transparent" stroke="#0078D4" stroke-width="2"/>
  <text x="42" y="322" class="t subtitle" text-anchor="start">Invoke — private path (HS5 / C4)</text>
  <rect x="60" y="340" width="300" height="160" rx="8" ry="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="210" y="400" class="t lab" text-anchor="middle"><tspan x="210" dy="0" font-weight="700">vm-diag</tspan><tspan x="210" dy="16">MgmtSubnet 192.168.2.4</tspan><tspan x="210" dy="16">SDK or azd CLI</tspan><tspan x="210" dy="16">needs Foundry Agent Consumer</tspan></text>
  <rect x="410" y="340" width="260" height="70" rx="8" ry="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="540" y="371" class="t lab" text-anchor="middle"><tspan x="540" dy="0" font-weight="700">Private DNS zone</tspan><tspan x="540" dy="16">A → 192.168.1.x</tspan></text>
  <rect x="410" y="430" width="260" height="70" rx="8" ry="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="540" y="461" class="t lab" text-anchor="middle"><tspan x="540" dy="0" font-weight="700">Private endpoint</tspan><tspan x="540" dy="16">PESubnet 192.168.1.x</tspan></text>
  <path d="M 360 380 L 410 375" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="295.5" y="347.5" width="179" height="20" fill="#FFFFFF" opacity="0.92"/>
  <text x="385" y="359.5" class="t edge" text-anchor="middle"><tspan x="385" dy="0">DNS resolves → 192.168.1.x</tspan></text>
  <path d="M 360 460 L 410 465" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="334.5" y="468.5" width="101" height="20" fill="#FFFFFF" opacity="0.92"/>
  <text x="385" y="480.5" class="t edge" text-anchor="middle"><tspan x="385" dy="0">HTTPS SDK call</tspan></text>
  <rect x="950" y="300" width="420" height="220" rx="8" ry="8" fill="transparent" stroke="#0078D4" stroke-width="2"/>
  <text x="962" y="322" class="t subtitle" text-anchor="start">Foundry — hosted agent runtime</text>
  <rect x="980" y="350" width="360" height="60" rx="8" ry="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="1160" y="376" class="t lab" text-anchor="middle"><tspan x="1160" dy="0" font-weight="700">Foundry endpoint</tspan><tspan x="1160" dy="16">account.services.ai.azure.com</tspan></text>
  <rect x="980" y="430" width="360" height="70" rx="8" ry="8" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <text x="1160" y="453" class="t lab" text-anchor="middle"><tspan x="1160" dy="0" font-weight="700">Micro VM runtime</tspan><tspan x="1160" dy="16">echo-probe-agent</tspan><tspan x="1160" dy="16">AgentSubnet 192.168.0.y</tspan></text>
  <path d="M 1160 410 L 1160 430" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 670 465 L 980 380" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="795" y="404.5" width="60" height="20" fill="#FFFFFF" opacity="0.92"/>
  <text x="825" y="416.5" class="t edge" text-anchor="middle"><tspan x="825" dy="0">HTTPS</tspan></text>
  <path d="M 380 172 L 420 172 L 420 285 L 940 285 L 940 380 L 980 380" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 380 232 L 440 232 L 440 275 L 935 275 L 935 380 L 980 380" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="490" y="270" width="290" height="20" fill="#FFFFFF" opacity="0.95"/>
  <text x="635" y="284" class="t edge" text-anchor="middle" font-weight="700">deploy (source-ZIP upload)</text>
  <path d="M 880 200 L 925 200 L 925 380 L 980 380" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="560" width="1340" height="200" rx="8" ry="8" fill="transparent" stroke="#107C10" stroke-width="2"/>
  <text x="42" y="582" class="t subtitle" text-anchor="start">Agent egress after invocation</text>
  <rect x="100" y="620" width="500" height="110" rx="8" ry="8" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="350" y="671" class="t lab" text-anchor="middle"><tspan x="350" dy="0" font-weight="700">vm-tools-echo</tspan><tspan x="350" dy="16">10.1.100.4  echo.tools.lab</tspan></text>
  <rect x="780" y="620" width="500" height="110" rx="8" ry="8" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="1030" y="671" class="t lab" text-anchor="middle"><tspan x="1030" dy="0" font-weight="700">vm-tools-ctrl</tspan><tspan x="1030" dy="16">10.1.200.4  ctrl.tools.lab</tspan></text>
  <path d="M 1080 500 L 350 620" fill="none" stroke="#F7630C" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="658" y="542" width="114" height="20" fill="#FFFFFF" opacity="0.92"/>
  <text x="715" y="554" class="t edge" text-anchor="middle"><tspan x="715" dy="0">direct code call</tspan></text>
  <path d="M 1240 500 L 1030 620" fill="none" stroke="#F7630C" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1078" y="542" width="114" height="20" fill="#FFFFFF" opacity="0.92"/>
  <text x="1135" y="554" class="t edge" text-anchor="middle"><tspan x="1135" dy="0">direct code call</tspan></text>
  <rect x="30" y="790" width="1340" height="80" rx="8" ry="8" fill="#FFF4CE" stroke="#F7630C" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="50" y="824" class="t lab-b" text-anchor="start"><tspan x="50" dy="0" font-weight="700">RBAC required: Foundry Agent Consumer at project scope, enforced on the invoking caller (vm-diag / workstation).</tspan><tspan x="50" dy="20">Without it: SDK returns 401/403 even when the network path (PE + private DNS) is fully working.</tspan></text>
</svg>
