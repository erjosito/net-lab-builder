<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 880" width="1500" height="880" role="img" aria-label="01 — Peered tools topology (T1)">
  <title>01 — Peered tools topology (T1)</title>
  <rect x="0" y="0" width="1500" height="880" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D13438"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#107C10"/>
    </marker>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #000; }
    .title { font-size: 20px; font-weight: 700; }
    .subtitle { font-size: 13px; font-weight: 600; fill: #333; }
    .lab { font-size: 13px; }
    .lab-b { font-size: 13px; font-weight: 700; }
    .small { font-size: 11px; fill: #333; }
    .edge { font-size: 11px; fill: #1e1e1e; }
    .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 11px; }
  </style>
  <text x="30" y="34" class="t title" text-anchor="start"><tspan x="30" dy="0">01 — Peered tools topology (T1)</tspan></text>
  <text x="30" y="60" class="t small" text-anchor="start"><tspan x="30" dy="0">Topology T1 — vnet-foundry peered with vnet-tools. No VPN gateway. Scenarios: HS1–HS5.</tspan></text>
  <rect x="40" y="90" width="360" height="380" rx="8" ry="8" fill="transparent" stroke="#0078D4" stroke-width="2"/>
  <text x="52" y="112" class="t subtitle" text-anchor="start">Foundry platform — Microsoft-managed</text>
  <rect x="130" y="140" width="180" height="60" rx="8" ry="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="220" y="166" class="t lab" text-anchor="middle"><tspan x="220" dy="0" font-weight="700">Foundry endpoint</tspan><tspan x="220" dy="16">account.services.ai.azure.com</tspan></text>
  <rect x="130" y="220" width="180" height="44" rx="8" ry="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="220" y="246" class="t lab" text-anchor="middle"><tspan x="220" dy="0" font-weight="700">Tools Service</tspan></text>
  <rect x="60" y="300" width="160" height="74" rx="8" ry="8" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="140" y="325" class="t lab" text-anchor="middle"><tspan x="140" dy="0" font-weight="700">Data Proxy</tspan><tspan x="140" dy="16">AgentSubnet</tspan><tspan x="140" dy="16">192.168.0.x</tspan></text>
  <rect x="240" y="300" width="160" height="74" rx="8" ry="8" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <text x="320" y="325" class="t lab" text-anchor="middle"><tspan x="320" dy="0" font-weight="700">Micro VM NIC</tspan><tspan x="320" dy="16">192.168.0.y</tspan><tspan x="320" dy="16">hosted agent only</tspan></text>
  <path d="M 220 200 L 220 220" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 190 264 L 140 300" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 250 264 L 320 300" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="460" y="90" width="460" height="380" rx="8" ry="8" fill="transparent" stroke="#0078D4" stroke-width="2"/>
  <text x="472" y="112" class="t subtitle" text-anchor="start">vnet-foundry 192.168.0.0/16 — swedencentral</text>
  <rect x="490" y="140" width="180" height="72" rx="8" ry="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="580" y="164" class="t lab" text-anchor="middle"><tspan x="580" dy="0" font-weight="700">PESubnet /24</tspan><tspan x="580" dy="16">Foundry private</tspan><tspan x="580" dy="16">endpoints</tspan></text>
  <rect x="690" y="140" width="180" height="72" rx="8" ry="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="780" y="164" class="t lab" text-anchor="middle"><tspan x="780" dy="0" font-weight="700">MgmtSubnet /27</tspan><tspan x="780" dy="16">vm-diag</tspan><tspan x="780" dy="16">192.168.2.4</tspan></text>
  <rect x="490" y="240" width="180" height="78" rx="8" ry="8" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <text x="580" y="275" class="t lab" text-anchor="middle"><tspan x="580" dy="0" font-weight="700">DNS Outbound EP</tspan><tspan x="580" dy="16">192.168.3.20</tspan></text>
  <rect x="690" y="240" width="180" height="78" rx="8" ry="8" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <text x="780" y="275" class="t lab" text-anchor="middle"><tspan x="780" dy="0" font-weight="700">DNS Inbound EP</tspan><tspan x="780" dy="16">192.168.3.4</tspan></text>
  <rect x="600" y="350" width="180" height="90" rx="8" ry="8" fill="#F3F2F1" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="690" y="391" class="t lab" text-anchor="middle"><tspan x="690" dy="0" font-weight="700">GatewaySubnet /27</tspan><tspan x="690" dy="16">EMPTY — no VPN GW</tspan></text>
  <rect x="970" y="90" width="500" height="380" rx="8" ry="8" fill="transparent" stroke="#107C10" stroke-width="2"/>
  <text x="982" y="112" class="t subtitle" text-anchor="start">vnet-tools 10.1.0.0/16 — swedencentral</text>
  <rect x="1010" y="150" width="340" height="100" rx="8" ry="8" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="1180" y="188" class="t lab" text-anchor="middle"><tspan x="1180" dy="0" font-weight="700">vm-tools-echo  10.1.100.4</tspan><tspan x="1180" dy="16">EchoSubnet 10.1.100.0/24</tspan><tspan x="1180" dy="16">nginx + dnsmasq :53</tspan></text>
  <rect x="1010" y="290" width="340" height="90" rx="8" ry="8" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="1180" y="323" class="t lab" text-anchor="middle"><tspan x="1180" dy="0" font-weight="700">vm-tools-ctrl  10.1.200.4</tspan><tspan x="1180" dy="16">CtrlSubnet 10.1.200.0/24</tspan><tspan x="1180" dy="16">nginx echo</tspan></text>
  <path d="M 690 470 L 690 500 L 1220 500 L 1220 470" fill="none" stroke="#0078D4" stroke-width="2" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <text x="955" y="492" class="t lab-b" text-anchor="middle"><tspan x="955" dy="0">VNet peering — bidirectional  ·  10.1.0.0/16 non-reserved — allowed</tspan></text>
  <rect x="40" y="500" width="1420" height="190" rx="8" ry="8" fill="transparent" stroke="#495057" stroke-width="2"/>
  <text x="52" y="522" class="t subtitle" text-anchor="start">Traffic that crosses the peering (T1)</text>
  <rect x="60" y="532" width="16" height="16" rx="3" ry="3" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="86" y="544" class="t lab" text-anchor="start"><tspan x="86" dy="0">Data Proxy (AgentSubnet 192.168.0.x)  →  vm-tools-echo / -ctrl (10.1.100.4, 10.1.200.4)   ·   tool calls, HTTP/S 80/443</tspan></text>
  <rect x="60" y="564" width="16" height="16" rx="3" ry="3" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <text x="86" y="576" class="t lab" text-anchor="start"><tspan x="86" dy="0">Micro VM NIC (AgentSubnet 192.168.0.y)  →  vm-tools-echo   ·   direct code call, HTTP/S — hosted agent only</tspan></text>
  <rect x="60" y="596" width="16" height="16" rx="3" ry="3" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="86" y="608" class="t lab" text-anchor="start"><tspan x="86" dy="0">DNS Outbound EP (192.168.3.20)  →  dnsmasq on vm-tools-echo :53   ·   tools.lab forwarding, UDP/TCP 53</tspan></text>
  <rect x="60" y="628" width="16" height="16" rx="3" ry="3" fill="#F3F2F1" stroke="#1e1e1e" stroke-width="2"/>
  <text x="86" y="640" class="t lab" text-anchor="start"><tspan x="86" dy="0">MgmtSubnet (vm-diag 192.168.2.4)  →  vm-tools-echo   ·   Run Command / SSH — admin ops</tspan></text>
  <rect x="40" y="720" width="1420" height="140" rx="8" ry="8" fill="transparent" stroke="#495057" stroke-width="2"/>
  <text x="52" y="742" class="t subtitle" text-anchor="start">Legend</text>
  <rect x="60" y="766" width="24" height="20" rx="8" ry="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="94" y="781" class="t lab" text-anchor="start"><tspan x="94" dy="0">Foundry platform / VNet elements</tspan></text>
  <rect x="520" y="766" width="24" height="20" rx="8" ry="8" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="554" y="781" class="t lab" text-anchor="start"><tspan x="554" dy="0">Data Proxy (both agent types)</tspan></text>
  <rect x="980" y="766" width="24" height="20" rx="8" ry="8" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <text x="1014" y="781" class="t lab" text-anchor="start"><tspan x="1014" dy="0">Micro VM NIC &amp; DNS resolver EPs</tspan></text>
  <rect x="60" y="806" width="24" height="20" rx="8" ry="8" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="94" y="821" class="t lab" text-anchor="start"><tspan x="94" dy="0">vnet-tools workloads</tspan></text>
  <rect x="520" y="806" width="24" height="20" rx="8" ry="8" fill="#F3F2F1" stroke="#1e1e1e" stroke-width="2"/>
  <text x="554" y="821" class="t lab" text-anchor="start"><tspan x="554" dy="0">Inert / empty subnet (dashed)</tspan></text>
</svg>
