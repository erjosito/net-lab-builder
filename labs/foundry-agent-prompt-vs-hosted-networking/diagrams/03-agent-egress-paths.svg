  <text x="50" y="670" class="t lab-b" text-anchor="start"><tspan x="50" dy="0" font-weight="700">Design intent and measurement provenance:</tspan><tspan x="50" dy="22">• Path 1 (HS1, BASELINE): sibling lab 2026-08-14; src_ip = 192.168.0.49 / 192.168.0.239 (data proxy). Not re-measured here.</tspan><tspan x="50" dy="22">• Path 2 (Toolbox, PREDICTED): the Toolbox-mediated tool-call path is described by SDK design docs. Not implemented, deployed, or measured in this lab.</tspan><tspan x="50" dy="22">• Path 3 (HS2, MEASURED): 7 hosted invocations (2026-08-21): REST .238/.28/.110 (3 runs); SDK .92/.142/.165 (3 runs); SSE .124 (1 run). 4th REST attempt NSG-blocked — no src_ip recorded.</tspan><tspan x="50" dy="22">See raw-output/test-matrix-results-20260821.md and raw-output/probe-network-sdk-evidence-20260821.md for source evidence.</tspan></text>
