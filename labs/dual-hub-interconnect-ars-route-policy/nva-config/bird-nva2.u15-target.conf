# NVA2 -- ASN 65002 -- switzerlandnorth
router id 10.20.1.4;

protocol device { }

protocol direct {
  ipv4 { import all; };
}

protocol kernel {
  ipv4 {
    import where net = 0.0.0.0/0;
    export where source ~ [RTS_BGP, RTS_DEVICE];
  };
}

# Delta-1: strip AS 65515 before advertising to the local hub ARS.
# (The Delta-2 set-C prepend clause was removed by U1.5 -- see header item 5.)
filter export_to_hub2_ars {
  if net ~ [ 0.0.0.0/0, 10.21.0.0/23 ] then {
    bgp_path.delete(65515);
    accept;
  }
  reject;
}

# --- hub2 ARS sessions (local, multihop 2) ---------------------------------------------------
# ARS hub2 instance IPs: 10.20.0.68, 10.20.0.69 (RouteServerSubnet 10.20.0.64/27)
protocol static {
  ipv4;
  route 10.20.0.64/27 via 10.20.1.1;
  route 10.21.0.0/23 via 10.20.1.1;
  route 0.0.0.0/0 via 10.20.1.1;
}

protocol bgp ars_hub2_0 {
  local 10.20.1.4 as 65002;
  neighbor 10.20.0.68 as 65515;
  multihop 2;
  ipv4 {
    import all;
    export filter export_to_hub2_ars;
  };
}

protocol bgp ars_hub2_1 {
  local 10.20.1.4 as 65002;
  neighbor 10.20.0.69 as 65515;
  multihop 2;
  ipv4 {
    import all;
    export filter export_to_hub2_ars;
  };
}

