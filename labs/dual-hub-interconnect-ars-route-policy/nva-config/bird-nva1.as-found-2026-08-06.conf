# NVA1 [ascii] ASN 65001 [ascii] swedencentral
router id 10.10.1.4;

protocol device { }

protocol direct {
  ipv4 { import all; };
}

protocol kernel {
  ipv4 {
    import where net = 0.0.0.0/0;
    export where source ~ [RTS_BGP, RTS_DEVICE];
  };
}

# 1: strip AS 65515 before advertising to hub ARS
# Rationale: routes from Poland ARS carry [65515,65001]; without strip,
#            hub ARS (ASN 65515) drops them as loop.
filter export_to_hub_ars {
  bgp_path.delete(65515);
  accept;
}

filter export_to_poland_ars {                                    # <<< U1.5 REMOVE (block)
  accept;                                                        # <<< U1.5 REMOVE
}                                                                # <<< U1.5 REMOVE

# [ascii] hub1 ARS sessions (local, no multihop) [ascii]
# ARS hub1 instance IPs: 10.10.0.68, 10.10.0.69 (from RouteServerSubnet 10.10.0.64/27)
protocol static {
  ipv4;
  route 10.10.0.64/27 via 10.10.1.1;
  route 10.30.0.0/27 via 10.10.1.1;                              # <<< U1.5 REMOVE (line)
  route 0.0.0.0/0 via 10.10.1.1;
}

protocol bgp ars_hub1_0 {
  local 10.10.1.4 as 65001;
  neighbor 10.10.0.68 as 65515;
  multihop 2;
  ipv4 {
    import all;
    export filter export_to_hub_ars;
  };
}

protocol bgp ars_hub1_1 {
  local 10.10.1.4 as 65001;
  neighbor 10.10.0.69 as 65515;
  multihop 2;
  ipv4 {
    import all;
    export filter export_to_hub_ars;
  };
}

