# =============================================================================================
# U3a OVERLAY SNIPPET -- vm-nva1 ONLY. NOT APPLIED. TEMPORARY BY CONSTRUCTION.
#
# Status:   approval unit U3a. Applied ONLY after U1.5 and U2 have both PASSED, and only with
#           Jose's explicit approval. Removed again at U3 rollback.
# Target:   appended verbatim to the END of bird-nva1.u15-target.conf, producing the file that
#           U3a writes to /etc/bird/bird.conf on vm-nva1. Nothing else in the config changes.
# Reload:   `birdc configure` (graceful). A new `protocol static` instance is added; existing
#           protocols are untouched, so ars_hub1_0/1 do NOT flap.
#
# WHY THIS EXISTS
#   U3 (T2b) needs a route that (a) ars-hub1 genuinely learns from peer-nva1, so an INBOUND
#   route map can act on it, and (b) is harmless. After U1.5, ars-hub1 learns only:
#       0.0.0.0/0       -- FORBIDDEN target (rt-spoke-a UDR semantics, DEF-001 evidence)
#       10.40.0.0/16    -- FORBIDDEN target (on-prem prefix; present on IN_1 only, so any
#                          before/after diff would be instance-asymmetric and unfalsifiable)
#   and the previously-assumed target `10.10.0.64/27` is NOT learned at all -- U0 proved Azure
#   Route Server silently rejects a route matching its own RouteServerSubnet. So U3 has no
#   valid pre-existing target and must create one.
#
# WHY 198.51.100.0/24
#   RFC 5737 TEST-NET-2. Reserved for documentation, globally unroutable, and verified absent
#   from every live surface in this bed on 2026-08-06 (ars-hub1 learned + advertised, ars-hub2
#   learned + advertised, both hub gateways, vpngw-onprem, both NVA RIBs, both NVA NICs).
#   Deliberately distinct from 192.0.2.0/24 (TEST-NET-1, used by rm-hub*-activate) and from
#   203.0.113.0/24 (TEST-NET-3, used by U2's inert rule) so that no evidence is ambiguous about
#   which artefact produced which effect.
#
# WHY `blackhole` AND NOT `via 10.10.1.1`
#   `protocol kernel` exports only [RTS_BGP, RTS_DEVICE], so a static never reaches the Linux
#   FIB either way -- but `blackhole` additionally guarantees that if anything ever did forward
#   toward TEST-NET-2 it is discarded locally rather than looped back at the VNet gateway.
#
# EXPECTED, ACCEPTED SIDE EFFECTS (state them in the approval, do not discover them later)
#   * ars-hub1 learns 198.51.100.0/24, asPath "65001", nextHop 10.10.1.4, on BOTH instances.
#   * The prefix is programmed into vnet-hub1 NIC effective routes (nextHop 10.10.1.4) and,
#     via peer-hub1-to-spoke-a's gateway transit, very likely into vnet-spoke-a NICs too. This
#     cannot be read directly this window (vm-hub1-ep is deallocated and stays deallocated);
#     record it as unverified-by-design, not as a claim.
#   * It behaves exactly as the stale 10.30.0.0/27 did -- U0/U1 evidence already proves an
#     NVA-originated static of this shape does NOT reach vpngw-hub1, vpngw-hub2 or vpngw-onprem.
#     That containment must be RE-PROVEN in U3a's evidence, not assumed.
#   * A documentation prefix is harmless by definition: no lab or production flow targets it.
#
# ROLLBACK: delete this block, `birdc configure`, confirm 198.51.100.0/24 is withdrawn from
#           ars-hub1 on both instances. Or `birdc configure undo` if it is the last change.
# =============================================================================================

# U3a temporary documentation test prefix -- RFC 5737 TEST-NET-2. REMOVE AT U3 ROLLBACK.
protocol static u3_doc_test {
  ipv4;
  route 198.51.100.0/24 blackhole;
}
