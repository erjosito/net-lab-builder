protocol bgp mesh_cn {
  local 172.31.0.21 as 65013;
  neighbor 172.31.0.22 as 65014;
  multihop 2;
  hold time 180;
  keepalive time 60;
  ipv4 {
    table lab4;
    igp table underlay4;
    gateway recursive;
    next hop self;
    import filter {
      bgp_next_hop = 172.31.0.22;
      if net = 10.140.0.0/24 then { bgp_community = -empty-; accept; }
      
      reject;
    };
    export filter mesh_export;
  };
}

