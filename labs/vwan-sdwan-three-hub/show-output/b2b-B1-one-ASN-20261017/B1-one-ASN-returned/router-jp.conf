log syslog all;
router id 10.130.0.4;
ipv4 table underlay4;
ipv4 table lab4;
protocol device devices { scan time 10; }
protocol direct connected {
  ipv4 { table underlay4; };
  interface "eth0", "wg*";
}
protocol static control_pins {
  ipv4 { table underlay4; };
  route 10.210.0.4/32 via 10.130.0.1;
  route 10.220.0.4/32 via 10.130.0.1;
  route 10.140.0.4/32 via 10.130.0.1;
  route 169.254.21.2/32 via "xfrm41";
  route 169.254.21.6/32 via "xfrm42";
}
protocol static own_dc {
  ipv4 { table lab4; };
  route 10.130.0.0/24 via "eth0";
}
function regional_preference(int ingress) {
  if (net = 10.10.0.0/24 && ingress = 65011) ||
     (net = 10.20.0.0/24 && ingress = 65012) ||
     (net = 10.30.0.0/24 && ingress = 65013) then
    bgp_local_pref = 300;
  else bgp_local_pref = 100;
}
filter azure_export {
  if net ~ [10.110.0.0/24, 10.120.0.0/24, 10.130.0.0/24, 10.140.0.0/24] &&
     (proto = "own_dc" || proto ~ "mesh_*") then accept;
  reject;
}
filter mesh_export {
  if net = 10.130.0.0/24 && proto = "own_dc" then accept;
  if net ~ [10.10.0.0/24, 10.20.0.0/24, 10.30.0.0/24] && proto ~ "azure_*" then {
    bgp_community.add((65013, 1));
    accept;
  }
  reject;
}
protocol kernel kernel_lab {
  kernel table 254;
  metric 80;
  ipv4 {
    table lab4;
    import none;
    export filter {
      if net = 10.130.0.0/24 && 1 = 1 then reject;
      if net ~ [10.110.0.0/24, 10.120.0.0/24, 10.130.0.0/24, 10.140.0.0/24, 10.10.0.0/24, 10.20.0.0/24, 10.30.0.0/24] then accept;
      reject;
    };
  };
}

protocol bgp mesh_eu {
  local 172.31.0.6 as 65013;
  neighbor 172.31.0.5 as 65011;
  multihop 2;
  hold time 180;
  keepalive time 60;
  ipv4 {
    table lab4;
    igp table underlay4;
    gateway recursive;
    next hop self;
    import filter {
      bgp_next_hop = 172.31.0.5;
      if net = 10.110.0.0/24 then { bgp_community = -empty-; accept; }
      if net ~ [10.10.0.0/24, 10.20.0.0/24, 10.30.0.0/24] then {
        bgp_community = -empty-;
        bgp_community.add((65011, 1));
        regional_preference(65011);
        accept;
      }
      reject;
    };
    export filter mesh_export;
  };
}

