<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1510" viewBox="0 0 1800 1510" role="img" aria-labelledby="title desc"><title id="title">routing-intent</title><desc id="desc">Offline lab documentation. Current topology is unsecured; routing intent comparison is planned, not tested.</desc><rect width="1800" height="1510" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="50" font-size="30" fill="#000000"><tspan x="40" dy="0">Routing intent comparison: collect the right evidence</tspan></text><text x="40" y="111" font-size="21" fill="#000000"><tspan x="40" dy="0">LEFT: current unsecured model. RIGHT: PLANNED only — no firewall / RI deployment or test yet.</tspan></text><rect x="30" y="190" width="840" height="1150" rx="12" stroke="#1864ab" stroke-width="2" fill="none"/><rect x="930" y="190" width="840" height="1150" rx="12" stroke="#e67700" stroke-width="2" fill="none"/><text x="60" y="233" font-size="23" fill="#000000"><tspan x="60" dy="0">WITHOUT RI | current topology, not current health</tspan></text><text x="960" y="233" font-size="23" fill="#000000"><tspan x="960" dy="0">WITH PRIVATE RI | PLANNED / NOT TESTED</tspan></text><rect x="90" y="320" width="720" height="180" rx="12" stroke="#1864ab" stroke-width="2" fill="#a5d8ff"/><text x="110" y="355" font-size="20" fill="#000000"><tspan x="110" dy="0">Azure spoke -&gt; its hub</tspan><tspan x="110" dy="30.0">Repeat for EU, US, JP</tspan><tspan x="110" dy="30.0">Record actual HRP + RI metadata each step</tspan></text><rect x="990" y="320" width="720" height="180" rx="12" stroke="#1864ab" stroke-width="2" fill="#a5d8ff"/><text x="1010" y="355" font-size="20" fill="#000000"><tspan x="1010" dy="0">Azure spoke -&gt; its hub</tspan><tspan x="1010" dy="30.0">All three hubs must have converged PrivateTraffic RI</tspan><tspan x="1010" dy="30.0">Repeat for EU, US, JP</tspan></text><polyline points="450,500 450,590" fill="none" stroke="#1864ab" stroke-width="3"/><polyline points="1350,500 1350,590" fill="none" stroke="#e67700" stroke-width="3" stroke-dasharray="10 7"/><rect x="90" y="590" width="720" height="230" rx="12" stroke="#1864ab" stroke-width="2" fill="#a5d8ff"/><text x="110" y="625" font-size="20" fill="#000000"><tspan x="110" dy="0">READ: hub connection effective routes</tspan><tspan x="110" dy="30.0">resourceId = actual conn-spoke-* ARM ID</tspan><tspan x="110" dy="30.0">resource-type = HubVirtualNetworkConnection</tspan><tspan x="110" dy="30.0">Preserve full winning prefixes / AS paths / next hops</tspan></text><rect x="990" y="590" width="720" height="230" rx="12" stroke="#e67700" stroke-width="2" fill="#fff3bf"/><text x="1010" y="625" font-size="20" fill="#000000"><tspan x="1010" dy="0">Default table: private aggregates -&gt; firewall</tspan><tspan x="1010" dy="30.0">NOT post-inspection branch winners</tspan><tspan x="1010" dy="30.0">AZFW_Hub Standard firewall (planned)</tspan><tspan x="1010" dy="30.0">One firewall per hub; shared scoped policy</tspan></text><polyline points="450,810 450,900" fill="none" stroke="#1864ab" stroke-width="3"/><polyline points="1350,810 1350,900" fill="none" stroke="#e67700" stroke-width="3" stroke-dasharray="10 7"/><rect x="90" y="900" width="720" height="230" rx="12" stroke="#495057" stroke-width="2" fill="#dee2e6"/><text x="110" y="935" font-size="20" fill="#000000"><tspan x="110" dy="0">Optional: defaultRouteTable effective view</tspan><tspan x="110" dy="30.0">Known provider result value=[] is visibility only</tspan><tspan x="110" dy="30.0">Do not infer zero learned routes or forwarding</tspan><tspan x="110" dy="30.0">Correlate BIRD, FIB, NIC, VPN and packet evidence</tspan></text><rect x="990" y="900" width="720" height="230" rx="12" stroke="#e67700" stroke-width="2" fill="#fff3bf"/><text x="1010" y="935" font-size="20" fill="#000000"><tspan x="1010" dy="0">DECISIVE READ: owning hub effectiveRoutes</tspan><tspan x="1010" dy="30.0">resourceId = ACTUAL Azure Firewall ARM ID</tspan><tspan x="1010" dy="30.0">resource-type = AzureFirewall</tspan><tspan x="1010" dy="30.0">Then correlate firewall flows + ingress candidates</tspan></text><text x="70" y="1188" font-size="18" fill="#000000"><tspan x="70" dy="0">CLI: az network vhub get-effective-routes</tspan><tspan x="70" dy="27.0">-g &lt;RG&gt; -n &lt;owning-hub&gt; --resource-id &lt;ARM-ID&gt;</tspan><tspan x="70" dy="27.0">--resource-type HubVirtualNetworkConnection -o json</tspan></text><text x="970" y="1188" font-size="18" fill="#000000"><tspan x="970" dy="0">CLI: az network vhub get-effective-routes</tspan><tspan x="970" dy="27.0">-g &lt;RG&gt; -n &lt;owning-hub&gt; --resource-id &lt;FIREWALL-ID&gt;</tspan><tspan x="970" dy="27.0">--resource-type AzureFirewall -o json</tspan></text><text x="50" y="1390" font-size="20" fill="#000000"><tspan x="50" dy="0">Firewall show resolves identity ONLY; it is not route retrieval. Wait for LRO completion; HTTP 202 alone is not evidence.</tspan></text><text x="50" y="1450" font-size="20" fill="#000000"><tspan x="50" dy="0">No measured RI winner, threshold, inspection, symmetry or reachability result is claimed. See README for copy-paste PowerShell.</tspan></text></g></svg>
